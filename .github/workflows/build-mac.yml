name: Build macOS (Apple Silicon + Intel)

# 在雲端的 macOS runner 上打包 .dmg（arm64 + x64 各一），你不用有 Mac。
# 打包完直接掛到「最新的 release」→ 任何人不用登入就能從 release 頁下載。
# 觸發：Actions 分頁手動 Run，或推 v* tag。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-mac:
    strategy:
      fail-fast: false # 一個架構失敗不拖垮另一個
      matrix:
        include:
          - arch: arm64
            runner: macos-15 # Apple Silicon（macos-14 已退役，job 會零步驟被取消）
          - arch: x64
            runner: macos-15-intel # Intel Mac（macos-13 退役後的官方 Intel runner）
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node deps
        run: npm install

      - name: Python venv + backend deps
        run: |
          python3 -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -r requirements.txt

      - name: Download sherpa models
        run: ./.venv/bin/python download_all_models.py

      - name: Build Python backend (PyInstaller, macOS ${{ matrix.arch }})
        run: npm run build:backend

      - name: Build renderer
        run: npm run build:renderer

      # dmg 打包會隨機失敗：hdiutil 退出磁碟時被 Spotlight 索引佔住
      # （"couldn't eject diskN - Resource busy"）。這是環境時序問題不是程式問題，
      # 重試即可；先關掉掛載點的索引降低發生率。
      - name: Build .dmg (${{ matrix.arch }}, ad-hoc signed)
        shell: bash
        run: |
          sudo mdutil -i off /Volumes 2>/dev/null || true
          for i in 1 2 3; do
            if npx electron-builder --mac --${{ matrix.arch }} --publish never; then
              exit 0
            fi
            echo "dmg 打包第 $i 次失敗（多半是 hdiutil 退出時被佔住），15 秒後重試…"
            hdiutil detach /Volumes/SpeakSlow 2>/dev/null || true
            rm -f dist/*.dmg
            sleep 15
          done
          echo "dmg 重試三次仍失敗"; exit 1

      - name: Upload dmg (backup artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SpeakSlow-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach dmg to the latest release (public download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --json tagName -q .tagName)
          FILE=$(ls dist/*.dmg | head -1)
          NAME=$(basename "$FILE")
          echo "Uploading $NAME to release $TAG"
          # 多平台同時 attach 常撞 GitHub secondary rate limit → 假紅燈。
          # 重試 + 最終以「資產是否真的在 release 上」為準（上傳常在收尾階段誤報失敗）。
          ok=0
          for i in 1 2 3 4; do
            if gh release upload "$TAG" "$FILE" --clobber; then ok=1; break; fi
            echo "attempt $i failed (likely rate limit), retry in $((i*45))s..."
            sleep $((i*45))
          done
          if [ "$ok" != "1" ]; then
            if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx "$NAME"; then
              echo "upload reported failure but $NAME is present on $TAG — success"
            else
              echo "ERROR: $NAME missing from $TAG after retries"; exit 1
            fi
          fi
