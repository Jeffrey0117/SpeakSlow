name: Build Linux (AppImage)

# 在雲端的 Ubuntu 上打包 Linux 版（你不需要有 Linux 機器）。
# 觸發方式：
#   - 手動：Actions 分頁 → 這個 workflow → Run workflow
#   - 推 tag：git push 一個 v* 開頭的 tag，會自動打包並附到該 release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # uiohook-napi / electron 在 Linux 編譯或執行時要的系統函式庫
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxtst-dev libx11-dev libxkbcommon-dev libxinerama-dev libpng-dev build-essential

      - name: Install Node deps
        shell: bash
        # 為什麼要重試：better-sqlite3@13 有 binding.gyp 但沒有 install script，
        # npm 看到這組合就會自動跑 node-gyp rebuild —— 即使它自己已經帶了八個
        # 平台的 prebuilds（prebuilds/darwin-x64.node 等，執行時用的就是那些）。
        # 那次沒必要的編譯會去 nodejs.org 抓 header，於是整個建置多了一個網路
        # 失敗點。2026-11-24 的 v1.0.39 就是這樣掛掉的：
        #   gyp ERR! stack ConnectTimeoutError: nodejs.org:443, timeout: 10000ms
        # 編譯本身無害（產物根本用不到），只是不該讓一次連線抖動就毀掉整個發版。
        run: |
          for i in 1 2 3; do
            npm install && exit 0
            echo "npm install 第 $i 次失敗，等 $((i*20)) 秒再試"
            sleep $((i*20))
          done
          echo "::error::npm install 連續三次失敗"
          exit 1

      - name: Python venv + backend deps
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -r requirements.txt

      - name: Download sherpa models
        run: ./.venv/bin/python download_all_models.py

      - name: Build Python backend (PyInstaller, Linux)
        run: npm run build:backend

      - name: Build renderer
        run: npm run build:renderer

      - name: Build AppImage
        run: npx electron-builder --linux --publish never

      - name: Upload AppImage (download from this run's Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: SpeakSlow-linux-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

      # 把 AppImage 掛到最新的 release（任何人不用登入就能從 release 頁下載）
      - name: Attach AppImage to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 這裡原本是 `gh release view --json tagName`（不帶參數），那會取「目前最新的
          # release」而不是觸發這次建置的 tag → 新版的安裝檔會被 --clobber 蓋到舊版的
          # release 上去，而新版則完全沒有檔案可下載（2026-11-07 實際發生：v1.0.33 的
          # 三平台安裝檔全部蓋進 v1.0.32 的 release）。一律以觸發的 tag 為準。
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [ -z "$TAG" ]; then
            # 手動觸發（workflow_dispatch）沒有 tag，退回最新的 release
            TAG=$(gh release view --json tagName -q .tagName)
          fi
          # release 還不存在就先建一個，否則上傳會掛到別版去
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 不存在，先建立"
            gh release create "$TAG" --title "$TAG" --notes "建置中，發行說明稍後補上。" --latest
          fi
          FILE=$(ls dist/*.AppImage | head -1)
          NAME=$(basename "$FILE")
          echo "Uploading $NAME to release $TAG"
          # 三平台同時 attach 常撞 GitHub secondary rate limit → 假紅燈。
          # 重試 + 最終以「資產是否真的在 release 上」為準（上傳常在收尾階段誤報失敗）。
          ok=0
          for i in 1 2 3 4; do
            if gh release upload "$TAG" "$FILE" --clobber; then ok=1; break; fi
            echo "attempt $i failed (likely rate limit), retry in $((i*45))s..."
            sleep $((i*45))
          done
          if [ "$ok" != "1" ]; then
            if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx "$NAME"; then
              echo "upload reported failure but $NAME is present on $TAG — success"
            else
              echo "ERROR: $NAME missing from $TAG after retries"; exit 1
            fi
          fi
